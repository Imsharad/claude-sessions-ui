[package]
name = "claude-sessions-ui"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "claude_sessions_ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# P1 indexing backend
rusqlite = { version = "0.32", features = ["bundled"] }  # bundled = no system libsqlite3 dep
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"                                               # portable home/data dirs
walkdir = "2"                                            # JSONL directory walk
log = "0.4"
env_logger = "0.11"
tauri-plugin-wdio-webdriver = "1.2.0"

[dev-dependencies]
tempfile = "3.27.0"

